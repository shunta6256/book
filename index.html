<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Book Vault</title>
    <!-- PWA用のメタタグ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- FontAwesome (アイコン用) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-main: #0a0915; --bg-sidebar: #121026; --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06); --bg-selected: rgba(108, 92, 231, 0.2);
            --purple-neon: #a188ff; --purple-main: #6c5ce7; --text-main: #f3f2fa;
            --text-sub: #8b89a6; --star-color: #ffd32a;
            --white-frame: 1px solid rgba(255, 255, 255, 0.15);
            --danger-color: #ff3b30;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* サイドバー（本棚リスト） */
        .sidebar { width: 320px; background: var(--bg-sidebar); border-right: var(--white-frame); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); position: relative; z-index: 50; }
        
        /* 💡 スマホ表示（幅768px以下）で上の本棚の名前を消す設定 */
        .ios-header { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-top: 10px; }
        .ios-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .view-toggle-icons { display: flex; gap: 12px; font-size: 18px; color: var(--purple-neon); cursor: pointer; }
        .view-toggle-icons i { opacity: 0.4; transition: opacity 0.2s; }
        .view-toggle-icons i.active { opacity: 1; }
        
        .search-container { padding: 8px 16px; }
        .search-input { width: 100%; padding: 8px 12px; border: none; border-radius: 10px; background: rgba(255, 255, 255, 0.07); color: var(--text-main); outline: none; font-size: 15px; }
        .search-input::placeholder { color: var(--text-sub); }
        
        /* ステータスタブ */
        .status-tab-container { display: flex; padding: 4px 16px 12px 16px; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .status-tab-container::-webkit-scrollbar { display: none; }
        .status-tab-btn { flex: 1; min-width: 65px; background: rgba(255, 255, 255, 0.04); border: none; color: var(--text-sub); font-size: 12px; padding: 6px 0; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; white-space: nowrap; }
        .status-tab-btn.active { background: rgba(255, 255, 255, 0.15); color: #fff; }

        /* リストコンテナ */
        .note-list { flex: 1; overflow-y: auto; padding: 0 16px 80px 16px; display: flex; flex-direction: column; position: relative; }
        
        /* 💡 スワイプ削除のためのラッパー構造 */
        .swipe-row { position: relative; width: 100%; overflow: hidden; border-bottom: 1px solid rgba(255, 255, 255, 0.05); list-style: none; }
        .swipe-content { display: flex; gap: 14px; align-items: center; padding: 12px 0; background: var(--bg-sidebar); position: relative; z-index: 2; transition: transform 0.2s ease-out; width: 100%; cursor: pointer; }
        .swipe-delete-btn { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--danger-color); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; z-index: 1; border: none; cursor: pointer; }

        /* 通常リスト表示のスタイル */
        .note-item-cover { width: 34px; height: 46px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .note-item-cover img { width: 100%; height: 100%; object-fit: cover; }
        .note-item-cover i { color: var(--text-sub); font-size: 14px; }
        .note-item-body { flex: 1; min-width: 0; }
        .note-item-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .swipe-row.active .note-item-title { color: var(--purple-neon); }
        .note-item-meta { font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; }
        
        /* 💡 写真データ（グリッド画像）で並べるモードのスタイル */
        .note-list.grid-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 12px; padding-top: 10px; }
        .note-list.grid-mode .swipe-row { border: none; overflow: visible; }
        .note-list.grid-mode .swipe-delete-btn { display: none; } /* グリッド時は長押しまたは編集画面から削除 */
        .note-list.grid-mode .swipe-content { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 0; background: transparent; transform: none !important; }
        .note-list.grid-mode .note-item-cover { width: 100%; height: 105px; border-radius: 6px; }
        .note-list.grid-mode .note-item-cover i { font-size: 24px; }
        .note-list.grid-mode .note-item-body { width: 100%; }
        .note-list.grid-mode .note-item-title { font-size: 11px; margin-bottom: 0; text-align: center; white-space: nowrap; }
        .note-list.grid-mode .note-item-meta { display: none; }

        /* ボトムツールバー */
        .bottom-toolbar { position: absolute; bottom: 0; left: 0; width: 320px; height: 60px; background: rgba(18, 16, 38, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: var(--white-frame); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 60; transition: transform 0.25s ease; }
        .toolbar-icon-btn { background: transparent; border: none; color: var(--purple-neon); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; }
        .toolbar-icon-btn:disabled { opacity: 0.3; cursor: default; }

        /* メインコンテンツエリア */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-main); overflow: hidden; }
        
        /* ナビゲーションバー */
        .ios-nav-bar { height: 50px; border-bottom: var(--white-frame); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; flex-shrink: 0; background: rgba(10, 9, 21, 0.8); backdrop-filter: blur(10px); z-index: 40; }
        .back-menu-btn { background: transparent; border: none; color: var(--purple-neon); font-size: 16px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 4px; padding: 0; display: none; }
        .toggle-view-btn { background: rgba(255,255,255,0.05); border: none; color: var(--text-main); font-size: 13px; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-weight: 600; }

        .view-content { flex: 1; display: none; overflow-y: auto; width: 100%; }
        .view-content.active { display: block; }
        
        /* エディターコンテナ */
        .editor-container { padding: 20px; display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 800px; margin: 0 auto; }
        
        .editor-header { display: flex; gap: 20px; align-items: flex-start; width: 100%; border-bottom: var(--white-frame); padding-bottom: 20px; }
        .cover-dropzone { width: 85px; height: 120px; background: rgba(255, 255, 255, 0.03); border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-sub); text-align: center; cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .cover-dropzone img { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }
        
        .meta-grid { display: grid; grid-template-columns: 1fr; gap: 10px; flex: 1; }
        .meta-field { display: flex; align-items: center; gap: 12px; font-size: 14px; width: 100%; }
        .meta-field-label { width: 55px; color: var(--text-sub); font-weight: 500; flex-shrink: 0; }
        .meta-field input, .meta-field select { flex: 1; border: none; background: rgba(255,255,255,0.04); padding: 8px 12px; border-radius: 8px; color: var(--text-main); outline: none; font-size: 14px; min-width: 0; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.9); }
        
        .star-rating { display: flex; gap: 6px; font-size: 20px; color: rgba(255,255,255,0.1); cursor: pointer; }
        .star-rating span.selected { color: var(--star-color); }
        
        .input-title { width: 100%; border: none; background: transparent; color: #fff; font-size: 24px; font-weight: 700; outline: none; padding: 5px 0 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .input-memo { width: 100%; min-height: 350px; background: transparent; border: none; color: #e1e0e9; font-size: 16px; line-height: 1.6; resize: none; outline: none; padding: 0; }
        
        .no-selection { padding: 120px 20px; text-align: center; color: var(--text-sub); font-size: 15px; }
        
        /* 統計ビュー */
        .stats-container { padding: 20px; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; margin: 0 auto; }
        .stats-card { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; width: 100%; }
        .stat-badges { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-badge { flex: 1; background: rgba(255, 255, 255, 0.04); padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; color: var(--purple-neon); }

        /* 📱 スマートフォン特有の画面崩れ対策レスポンシブコード */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; top: 0; left: 0; bottom: 0; }
            .bottom-toolbar { width: 100%; }
            .main-content { width: 100%; position: absolute; top: 0; left: 0; bottom: 0; transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
            
            /* 💡 スマホの時は上の本棚のタイトル文字を消去 */
            .ios-title { display: none; }
            .ios-header { justify-content: flex-end; } /* 切り替え用アイコンを右端に寄せる */
            
            /* 詳細・編集画面が開いている時のスタイル */
            body.detail-open .main-content { transform: translateX(0); }
            body.detail-open .back-menu-btn { display: flex; }
        }
    </style>
</head>
<body>

    <!-- サイドバー（本棚リスト領域） -->
    <div class="sidebar" id="sidebar">
        <div class="ios-header">
            <div class="ios-title">本棚</div>
            <!-- 💡 表示モード切り替え（リスト表示 / 写真データ一覧） -->
            <div class="view-toggle-icons">
                <i class="fa-solid fa-list active" id="btn-list-view" title="リスト表示" onclick="setListMode('list')"></i>
                <i class="fa-solid fa-grid-2-large" style="margin-left: 15px;" id="btn-grid-view" class="fa-solid fa-table-cells" title="写真データ表示" onclick="setListMode('grid')"></i>
            </div>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" id="search-bar" placeholder="検索" oninput="renderBooks()">
        </div>
        
        <div class="status-tab-container">
            <button class="status-tab-btn active" onclick="filterStatus('all', this)">すべて</button>
            <button class="status-tab-btn" onclick="filterStatus('読書中', this)">読書中</button>
            <button class="status-tab-btn" onclick="filterStatus('読了', this)">読了</button>
            <button class="status-tab-btn" onclick="filterStatus('積読', this)">積読</button>
        </div>
        
        <!-- 本のデータリスト本体 -->
        <div class="note-list" id="book-list-container"></div>
        
        <div class="bottom-toolbar">
            <button class="toolbar-icon-btn" onclick="toggleStats()"><i class="fa-solid fa-chart-pie"></i></button>
            <button class="toolbar-icon-btn" onclick="createNewBook()"><i class="fa-solid fa-pen-to-square"></i></button>
        </div>
    </div>

    <!-- メインコンテンツ（編集・詳細画面） -->
    <div class="main-content">
        <div class="ios-nav-bar">
            <button class="back-menu-btn" onclick="closeDetail()"><i class="fa-solid fa-chevron-left"></i> 本棚</button>
            <button class="toggle-view-btn" id="delete-current-btn" style="background: rgba(255,59,48,0.15); color: #ff453a; display:none;" onclick="deleteCurrentBook()">削除</button>
        </div>
        
        <!-- エディター表示 -->
        <div id="view-editor" class="view-content active">
            <div id="editor-wrapper">
                <!-- JavaScriptで動的生成 -->
                <div class="no-selection">書籍を選択するか、新しい書籍を追加してください。</div>
            </div>
        </div>
        
        <!-- 統計表示 -->
        <div id="view-stats" class="view-content">
            <div class="stats-container">
                <div class="stats-card">
                    <h3 style="margin-top:0;">読書統計</h3>
                    <div class="stat-badges">
                        <div class="stat-badge" id="stat-total">総書籍: 0</div>
                        <div class="stat-badge" id="stat-done">読了: 0</div>
                    </div>
                    <p style="color:var(--text-sub); font-size:14px;">ステータス内訳</p>
                    <div id="stat-breakdown" style="font-size:14px; display:flex; flex-direction:column; gap:8px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // サンプルデータ構築
        let books = JSON.parse(localStorage.getItem('my_book_vault_data')) || [
            { id: '1', title: '銀河鉄道の夜', author: '宮沢賢治', status: '読了', rating: 5, date: '2026-05-01', cover: '', memo: '「本当の幸い」とは何かについて深く考えさせられる名著。なんども読み返したい。' },
            { id: '2', title: '人間失格', author: '太宰治', status: '読書中', rating: 3, date: '2026-05-15', cover: '', memo: '恥の多い生涯を送って来ました。' }
        ];

        let currentBookId = null;
        let currentFilter = 'all';
        let displayMode = 'list'; // 'list' または 'grid'
        
        // スワイプ削除トラッキング用変数
        let touchStartX = 0;
        let touchMoveX = 0;
        let activeSwipeRow = null;

        function saveToStorage() {
            localStorage.setItem('my_book_vault_data', JSON.stringify(books));
        }

        // 表示モード切り替え（リスト vs 写真グリッド）
        function setListMode(mode) {
            displayMode = mode;
            document.getElementById('btn-list-view').classList.toggle('active', mode === 'list');
            document.getElementById('btn-grid-view').classList.toggle('active', mode === 'grid');
            renderBooks();
        }

        // フィルター切り替え
        function filterStatus(status, element) {
            currentFilter = status;
            document.querySelectorAll('.status-tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            renderBooks();
        }

        // 本棚の一覧レンダリング
        function renderBooks() {
            const container = document.getElementById('book-list-container');
            const searchQuery = document.getElementById('search-bar').value.toLowerCase();
            container.innerHTML = '';
            
            // モードクラスの付与
            if (displayMode === 'grid') {
                container.classList.add('grid-mode');
            } else {
                container.classList.remove('grid-mode');
            }

            const filtered = books.filter(b => {
                const matchesStatus = currentFilter === 'all' || b.status === currentFilter;
                const matchesSearch = b.title.toLowerCase().includes(searchQuery) || b.author.toLowerCase().includes(searchQuery);
                return matchesStatus && matchesSearch;
            });

            filtered.forEach(book => {
                const row = document.createElement('div');
                row.className = `swipe-row ${book.id === currentBookId ? 'active' : ''}`;
                row.dataset.id = book.id;

                const coverContent = book.cover ? `<img src="${book.cover}" alt="cover">` : `<i class="fa-solid fa-book"></i>`;
                
                row.innerHTML = `
                    <div class="swipe-delete-btn" onclick="event.stopPropagation(); deleteBookById('${book.id}')">削除</div>
                    <div class="swipe-content" 
                         onclick="selectBook('${book.id}')"
                         ontouchstart="handleTouchStart(event)"
                         ontouchmove="handleTouchMove(event)"
                         ontouchend="handleTouchEnd(event)">
                        <div class="note-item-cover">${coverContent}</div>
                        <div class="note-item-body">
                            <div class="note-item-title">${book.title || '無題の書籍'}</div>
                            <div class="note-item-meta">
                                <span>${book.author || '著者未設定'}</span>
                                <span>${'★'.repeat(book.rating)}${'☆'.repeat(5-book.rating)}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        /* 💡 スワイプ削除のタッチイベント制御 */
        function handleTouchStart(e) {
            if (displayMode === 'grid') return; // グリッド時はスワイプ無効
            const rowContent = e.currentTarget;
            const swipeRow = rowContent.parentElement;
            
            // 他に開いているスワイプ行があればリセット
            if (activeSwipeRow && activeSwipeRow !== swipeRow) {
                resetSwipePosition(activeSwipeRow.querySelector('.swipe-content'));
            }
            
            touchStartX = e.touches[0].clientX;
            activeSwipeRow = swipeRow;
            rowContent.style.transition = 'none';
        }

        function handleTouchMove(e) {
            if (displayMode === 'grid' || !activeSwipeRow) return;
            const rowContent = e.currentTarget;
            touchMoveX = e.touches[0].clientX;
            let diffX = touchMoveX - touchStartX;
            
            // 左側へのスワイプ（負の値）のみ許容、最大80pxまで
            if (diffX < 0) {
                if (diffX < -100) diffX = -100; // 行き過ぎ防止
                rowContent.style.transform = `translateX(${diffX}px)`;
            } else {
                rowContent.style.transform = `translateX(0px)`;
            }
        }

        function handleTouchEnd(e) {
            if (displayMode === 'grid' || !activeSwipeRow) return;
            const rowContent = e.currentTarget;
            let diffX = touchMoveX - touchStartX;
            
            rowContent.style.transition = 'transform 0.2s ease-out';
            
            // 40px以上左にスワイプされたら削除ボタンを固定表示
            if (diffX < -40) {
                rowContent.style.transform = `translateX(-80px)`;
            } else {
                resetSwipePosition(rowContent);
            }
            touchStartX = 0;
            touchMoveX = 0;
        }

        function resetSwipePosition(el) {
            if(el) el.style.transform = 'translateX(0px)';
        }

        // ブック選択
        function selectBook(id) {
            currentBookId = id;
            document.getElementById('view-stats').classList.remove('active');
            document.getElementById('view-editor').classList.add('active');
            document.getElementById('delete-current-btn').style.display = 'block';
            
            // スマホ表示用クラス追加
            document.body.classList.add('detail-open');
            
            renderBooks();
            renderEditor();
        }

        // 新規作成
        function createNewBook() {
            const newBook = {
                id: Date.now().toString(),
                title: '',
                author: '',
                status: '積読',
                rating: 0,
                date: new Date().toISOString().split('T')[0],
                cover: '',
                memo: ''
            };
            books.unshift(newBook);
            saveToStorage();
            selectBook(newBook.id);
        }

        // スワイプや詳細画面からの削除
        function deleteBookById(id) {
            books = books.filter(b => b.id !== id);
            saveToStorage();
            if (currentBookId === id) {
                currentBookId = null;
                document.getElementById('editor-wrapper').innerHTML = '<div class="no-selection">書籍を選択するか、新しい書籍を追加してください。</div>';
                document.getElementById('delete-current-btn').style.display = 'none';
            }
            renderBooks();
        }

        function deleteCurrentBook() {
            if (currentBookId) {
                deleteBookById(currentBookId);
                closeDetail();
            }
        }

        // スマホ用閉じる処理
        function closeDetail() {
            document.body.classList.remove('detail-open');
            currentBookId = null;
            renderBooks();
        }

        // エディターフォームの描画
        function renderEditor() {
            const wrapper = document.getElementById('editor-wrapper');
            const book = books.find(b => b.id === currentBookId);
            if (!book) return;

            wrapper.innerHTML = `
                <div class="editor-container">
                    <div class="editor-header">
                        <div class="cover-dropzone" onclick="document.getElementById('cover-file-input').click()">
                            ${book.cover ? `<img src="${book.cover}" id="cover-preview">` : `<span id="cover-text">写真を<br>追加</span>`}
                            <input type="file" id="cover-file-input" style="display:none;" accept="image/*" onchange="uploadCover(event)">
                        </div>
                        
                        <div class="meta-grid">
                            <div class="meta-field">
                                <span class="meta-field-label">著者</span>
                                <input type="text" value="${book.author}" placeholder="著者名を入力" oninput="updateData('author', this.value)">
                            </div>
                            <div class="meta-field">
                                <span class="meta-field-label">状態</span>
                                <select onchange="updateData('status', this.value)">
                                    <option value="積読" ${book.status === '積読' ? 'selected' : ''}>積読</option>
                                    <option value="読書中" ${book.status === '読書中' ? 'selected' : ''}>読書中</option>
                                    <option value="読了" ${book.status === '読了' ? 'selected' : ''}>読了</option>
                                </select>
                            </div>
                            <div class="meta-field">
                                <span class="meta-field-label">日付</span>
                                <input type="date" value="${book.date}" onchange="updateData('date', this.value)">
                            </div>
                            <div class="meta-field">
                                <span class="meta-field-label">評価</span>
                                <div class="star-rating">
                                    ${[1,2,3,4,5].map(num => `
                                        <span class="${num <= book.rating ? 'selected' : ''}" onclick="updateRating(${num})">★</span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <input type="text" class="input-title" value="${book.title}" placeholder="書籍のタイトル" oninput="updateData('title', this.value)">
                    <textarea class="input-memo" placeholder="ここにメモや感想を自由に入力..." oninput="updateData('memo', this.value)">${book.memo}</textarea>
                </div>
            `;
        }

        // リアルタイムデータ更新
        function updateData(key, value) {
            const book = books.find(b => b.id === currentBookId);
            if (book) {
                book[key] = value;
                saveToStorage();
                // リストアイテムのタイトル表記などを同期
                renderBooks();
            }
        }

        function updateRating(rating) {
            const book = books.find(b => b.id === currentBookId);
            if (book) {
                book.rating = rating;
                saveToStorage();
                renderEditor();
                renderBooks();
            }
        }

        // 写真データのアップロード（Base64圧縮）
        function uploadCover(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                updateData('cover', base64Url);
                renderEditor();
            };
            reader.readAsDataURL(file);
        }

        // 統計画面
        function toggleStats() {
            const statsView = document.getElementById('view-stats');
            const editorView = document.getElementById('view-editor');
            
            if(statsView.classList.contains('active')) {
                statsView.classList.remove('active');
                editorView.classList.add('active');
            } else {
                editorView.classList.remove('active');
                statsView.classList.add('active');
                document.body.classList.add('detail-open');
                buildStats();
            }
        }
