<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Book Vault</title>
    <!-- PWA用のメタタグ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-main: #0a0915; --bg-sidebar: #121026; --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06); --bg-selected: rgba(108, 92, 231, 0.2);
            --purple-neon: #a188ff; --purple-main: #6c5ce7; --text-main: #f3f2fa;
            --text-sub: #8b89a6; --star-color: #ffd32a;
            --white-frame: 1px solid rgba(255, 255, 255, 0.15);
            --ios-yellow: #ffb900; /* iPhoneメモを意識したアクセントカラー（または元のパープルを選択可能） */
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* 💡 サイドバー（本棚リスト）：iPhoneの「フォルダ・メモ一覧」構成 */
        .sidebar { width: 320px; background: var(--bg-sidebar); border-right: var(--white-frame); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .ios-header { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-top: 10px; }
        .ios-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        
        .search-container { padding: 8px 16px; }
        .search-input { width: 100%; padding: 8px 12px; border: none; border-radius: 10px; background: rgba(255, 255, 255, 0.07); color: var(--text-main); outline: none; font-size: 15px; }
        .search-input::placeholder { color: var(--text-sub); }
        
        /* ステータスタブ：iPhoneのセグメントコントロール風 */
        .status-tab-container { display: flex; padding: 4px 16px 12px 16px; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .status-tab-container::-webkit-scrollbar { display: none; }
        .status-tab-btn { flex: 1; min-width: 65px; background: rgba(255, 255, 255, 0.04); border: none; color: var(--text-sub); font-size: 12px; padding: 6px 0; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; white-space: nowrap; }
        .status-tab-btn.active { background: rgba(255, 255, 255, 0.15); color: #fff; }

        /* リストアイテム：iPhoneメモのセルを再現 */
        .note-list { flex: 1; overflow-y: auto; padding: 0 16px 80px 16px; display: flex; flex-direction: column; }
        .note-item { padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; display: flex; gap: 14px; align-items: center; }
        .note-item.active { background: transparent; }
        .note-item.active .note-item-title { color: var(--purple-neon); }
        .note-item-cover { width: 34px; height: 46px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .note-item-cover img { width: 100%; height: 100%; object-fit: cover; }
        .note-item-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .note-item-meta { font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; }
        
        /* 💡 ボトムツールバー（iPhone風固定フッター） */
        .bottom-toolbar { position: absolute; bottom: 0; left: 0; width: 320px; height: 60px; background: rgba(18, 16, 38, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: var(--white-frame); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 60; transition: transform 0.25s ease; }
        .toolbar-icon-btn { background: transparent; border: none; color: var(--purple-neon); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; }
        .toolbar-icon-btn:disabled { opacity: 0.3; cursor: default; }

        /* メインコンテンツエリア：メモ編集画面 */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-main); overflow: hidden; }
        
        /* 編集画面のトップナビゲーションバー */
        .ios-nav-bar { height: 50px; border-bottom: var(--white-frame); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; flex-shrink: 0; background: rgba(10, 9, 21, 0.8); backdrop-filter: blur(10px); }
        .back-menu-btn { background: transparent; border: none; color: var(--purple-neon); font-size: 16px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 4px; padding: 0; }
        .toggle-view-btn { background: rgba(255,255,255,0.05); border: none; color: var(--text-main); font-size: 13px; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-weight: 600; }

        .view-content { flex: 1; display: none; overflow-y: auto; width: 100%; }
        .view-content.active { display: block; }
        
        /* 💡 エディターコンテナ：iPhone風のシームレスなメモ用紙スタイル */
        .editor-container { padding: 20px; display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 800px; margin: 0 auto; }
        
        /* メタ情報（表紙と書籍情報）をすっきり並べる */
        .editor-header { display: flex; gap: 20px; align-items: flex-start; width: 100%; border-bottom: var(--white-frame); padding-bottom: 20px; }
        .cover-dropzone { width: 85px; height: 120px; background: rgba(255, 255, 255, 0.03); border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-sub); text-align: center; cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .cover-dropzone img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        
        .meta-grid { display: grid; grid-template-columns: 1fr; gap: 10px; flex: 1; }
        .meta-field { display: flex; align-items: center; gap: 12px; font-size: 14px; width: 100%; }
        .meta-field-label { width: 55px; color: var(--text-sub); font-weight: 500; flex-shrink: 0; }
        .meta-field input, .meta-field select { flex: 1; border: none; background: rgba(255,255,255,0.04); padding: 8px 12px; border-radius: 8px; color: var(--text-main); outline: none; font-size: 14px; min-width: 0; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.9); }
        
        .star-rating { display: flex; gap: 6px; font-size: 20px; color: rgba(255,255,255,0.1); cursor: pointer; }
        .star-rating span.selected { color: var(--star-color); }
        
        /* 💡 本のタイトル入力欄：iPhoneメモの1行目大見出し風 */
        .input-title { width: 100%; border: none; background: transparent; color: #fff; font-size: 24px; font-weight: 700; outline: none; padding: 5px 0 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        /* 💡 メモテキストエリア：広大なフリー入力スペース */
        .input-memo { width: 100%; min-height: 350px; background: transparent; border: none; color: #e1e0e9; font-size: 16px; line-height: 1.6; resize: none; outline: none; padding: 0; }
        
        .no-selection { padding: 120px 20px; text-align: center; color: var(--text-sub); font-size: 15px; }
        
        /* 統計ビュー */
        .stats-container { padding: 20px; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; margin: 0 auto; }
        .stats-card { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; width: 100%; }
        .stat-badges { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-badge { flex: 1; background: rgba(255, 255, 255, 0.04); padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; color: var(--purple-neon); }
        .stat-badge span { display: block; font-size: 20px; font-weight: 700; margin-top: 4px; color: #fff; }
        .chart-title { font-size: 14px; font-weight: 600; color: var(--purple-neon); margin-bottom: 12px; }
        .chart-row { display: flex; align-items: center; gap: 12px; font-size: 13px; margin-bottom: 10px; }
        .chart-label { width: 40px; color: var(--text-sub); }
        .chart-bar-bg { flex: 1; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
        .chart-bar-fill { height: 100%; background: var(--purple-neon); width: 0%; transition: width 0.3s; }
        .chart-value { width: 40px; text-align: right; font-weight: 600; }

        /* 💡 【iPhoneレスポンシブ完全対応】全画面1ペイン切り替え */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; left: 0; top: 0; height: 100%; z-index: 50; }
            .bottom-toolbar { width: 100%; }
            
            /* エディタ展開時：リストとボトムバーを左へスライドアウト */
            body.editing .sidebar { transform: translateX(-100%); }
            body.editing .bottom-toolbar { transform: translateX(-100%); }
            
            .main-content { width: 100%; height: 100%; z-index: 40; }
            .editor-container { padding: 16px; }
            .input-title { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- サイドバー：本棚リスト画面 -->
    <div class="sidebar">
        <div class="ios-header">
            <div class="ios-title">本棚 vault</div>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="検索">
        </div>
        
        <div class="status-tab-container">
            <div class="status-tab-btn active" data-status="all">すべて</div>
            <div class="status-tab-btn" data-status="reading">読中</div>
            <div class="status-tab-btn" data-status="read">読了</div>
            <div class="status-tab-btn" data-status="stocked">積読</div>
        </div>
        
        <div class="note-list" id="book-list">
            <!-- 動的追加 -->
        </div>
    </div>

    <!-- 💡 固定ボトムツールバー（一覧画面の最下部に常駐） -->
    <div class="bottom-toolbar">
        <button class="toolbar-icon-btn" id="delete-book-btn" disabled title="削除">🗑️</button>
        <div style="font-size: 12px; color: var(--text-sub);" id="toolbar-count">0 冊の書籍</div>
        <button class="toolbar-icon-btn" id="add-book-btn" title="新規追加">📝</button>
    </div>

    <!-- メインコンテンツ：メモ詳細・編集画面 -->
    <div class="main-content">
        <div class="ios-nav-bar">
            <button class="back-menu-btn" id="back-to-list-btn">＜ 本棚</button>
            <button class="toggle-view-btn" id="toggle-stats-btn">📊 統計</button>
        </div>
        
        <!-- エディタービュー -->
        <div class="view-content active" id="view-editor">
            <div id="no-selection-msg" class="no-selection">
                <p style="font-size: 32px; margin-bottom: 10px;">📖</p>
                <p>選択されていません</p>
            </div>
            
            <div class="editor-container" id="editor-form" style="display: none;">
                <!-- 書籍情報ヘッダー -->
                <div class="editor-header">
                    <div class="cover-dropzone" id="cover-zone">
                        <span id="dropzone-text">表紙を追加</span>
                        <img src="" id="cover-preview" style="display: none;">
                        <input type="file" id="cover-input" accept="image/*" style="display: none;">
                    </div>
                    
                    <div class="meta-grid">
                        <div class="meta-field">
                            <span class="meta-field-label">著者</span>
                            <input type="text" id="book-author" placeholder="著者名">
                        </div>
                        <div class="meta-field">
                            <span class="meta-field-label">状態</span>
                            <select id="book-status">
                                <option value="stocked">積読</option>
                                <option value="reading">読中</option>
                                <option value="read">読了</option>
                            </select>
                        </div>
                        <div class="meta-field">
                            <span class="meta-field-label">評価</span>
                            <div class="star-rating" id="star-container">
                                <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
                            </div>
                        </div>
                        <div class="meta-field">
                            <span class="meta-field-label">読了日</span>
                            <input type="date" id="book-date">
                        </div>
                    </div>
                </div>
                
                <!-- 💡 iPhoneのメモ用紙ライクな入力エリア -->
                <input type="text" id="book-title" class="input-title" placeholder="無題の本">
                <textarea class="input-memo" id="book-memo" placeholder="ここに読書メモやフレーズを入力..."></textarea>
            </div>
        </div>
        
        <!-- 統計ビュー -->
        <div class="view-content" id="view-stats">
            <div class="stats-container">
                <div class="stats-card">
                    <div class="stat-badges">
                        <div class="stat-badge">蔵書数<span id="stat-total">0</span></div>
                        <div class="stat-badge">読了率<span id="stat-ratio">0%</span></div>
                    </div>
                    
                    <div class="chart-title">ステータス分布</div>
                    <div id="stats-bars"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScriptロジック -->
    <script>
        let books = JSON.parse(localStorage.getItem('my_book_vault_data')) || [];
        let currentBookId = null;
        let currentFilter = 'all';
        let isStatsView = false;

        const el = {
            bookList: document.getElementById('book-list'),
            addBtn: document.getElementById('add-book-btn'),
            deleteBtn: document.getElementById('delete-book-btn'),
            searchInput: document.getElementById('search-input'),
            tabBtns: document.querySelectorAll('.status-tab-btn'),
            editorForm: document.getElementById('editor-form'),
            noSelectMsg: document.getElementById('no-selection-msg'),
            toggleStatsBtn: document.getElementById('toggle-stats-btn'),
            viewEditor: document.getElementById('view-editor'),
            viewStats: document.getElementById('view-stats'),
            backListBtn: document.getElementById('back-to-list-btn'),
            toolbarCount: document.getElementById('toolbar-count'),
            
            title: document.getElementById('book-title'),
            author: document.getElementById('book-author'),
            status: document.getElementById('book-status'),
            date: document.getElementById('book-date'),
            memo: document.getElementById('book-memo'),
            stars: document.querySelectorAll('#star-container span'),
            coverZone: document.getElementById('cover-zone'),
            coverInput: document.getElementById('cover-input'),
            coverPreview: document.getElementById('cover-preview'),
            dropText: document.getElementById('dropzone-text'),
            
            statTotal: document.getElementById('stat-total'),
            statRatio: document.getElementById('stat-ratio'),
            statsBars: document.getElementById('stats-bars')
        };

        function saveData() {
            localStorage.setItem('my_book_vault_data', JSON.stringify(books));
            updateHeaderCounts();
            renderBookList();
            if(isStatsView) renderStats();
        }

        function updateHeaderCounts() {
            el.toolbarCount.textContent = `${books.length} 冊の書籍`;
        }

        function renderBookList() {
            el.bookList.innerHTML = '';
            const searchWord = el.searchInput.value.toLowerCase();
            
            const filtered = books.filter(book => {
                const matchTab = currentFilter === 'all' || book.status === currentFilter;
                const matchSearch = (book.title || '').toLowerCase().includes(searchWord) || (book.author || '').toLowerCase().includes(searchWord);
                return matchTab && matchSearch;
            });

            if (filtered.length === 0) {
                el.bookList.innerHTML = '<div style="text-align:center;color:var(--text-sub);font-size:14px;padding:40px 0;">書籍がありません</div>';
                return;
            }

            filtered.forEach(book => {
                const item = document.createElement('div');
                item.className = `note-item ${book.id === currentBookId ? 'active' : ''}`;
                item.onclick = () => selectBook(book.id);

                const starText = '★'.repeat(book.rating) + '☆'.repeat(5 - book.rating);
                const coverHTML = book.cover ? `<img src="${book.cover}">` : `<span style="font-size:9px;color:var(--text-sub)">No Img</span>`;
                const displayTitle = book.title.trim() === '' ? '無題の本' : book.title;

                item.innerHTML = `
                    <div class="note-item-cover">${coverHTML}</div>
                    <div style="flex:1; min-width:0;">
                        <div class="note-item-title">${displayTitle}</div>
                        <div class="note-item-meta">
                            <span>${book.author || '著者不明'}</span>
                            <span style="color:var(--star-color); margin-left:auto;">${starText}</span>
                        </div>
                    </div>
                `;
                el.bookList.appendChild(item);
            });
        }

        function selectBook(id) {
            currentBookId = id;
            const book = books.find(b => b.id === id);
            if (!book) return;

            document.body.classList.add('editing');

            el.title.value = book.title;
            el.author.value = book.author;
            el.status.value = book.status;
            el.date.value = book.date || '';
            el.memo.value = book.memo || '';
            setStarRating(book.rating || 0);

            if (book.cover) {
                el.coverPreview.src = book.cover;
                el.coverPreview.style.display = 'block';
                el.dropText.style.display = 'none';
            } else {
                el.coverPreview.style.display = 'none';
                el.dropText.style.display = 'block';
            }

            el.noSelectMsg.style.display = 'none';
            el.editorForm.style.display = 'block';
            el.deleteBtn.removeAttribute('disabled');

            renderBookList();
        }

        el.addBtn.onclick = () => {
            const newBook = {
                id: Date.now().toString(),
                title: '',
                author: '',
                status: currentFilter === 'all' ? 'stocked' : currentFilter,
                rating: 0,
                date: '',
                memo: '',
                cover: ''
            };
            books.unshift(newBook);
            saveData();
            selectBook(newBook.id);
            el.title.focus();
        };

        el.deleteBtn.onclick = () => {
            if (!currentBookId) return;
            if (confirm('この書籍を削除しますか？')) {
                books = books.filter(b => b.id !== currentBookId);
                currentBookId = null;
                el.editorForm.style.display = 'none';
                el.deleteBtn.setAttribute('disabled', 'true');
                el.noSelectMsg.style.display = 'block';
                document.body.classList.remove('editing');
                saveData();
            }
        };

        function updateCurrentBookField(field, value) {
            if (!currentBookId) return;
            const book = books.find(b => b.id === currentBookId);
            if (book) {
                book[field] = value;
                saveData();
            }
        }
        el.title.oninput = (e) => updateCurrentBookField('title', e.target.value);
        el.author.oninput = (e) => updateCurrentBookField('author', e.target.value);
        el.status.onchange = (e) => updateCurrentBookField('status', e.target.value);
        el.date.onchange = (e) => updateCurrentBookField('date', e.target.value);
        el.memo.oninput = (e) => updateCurrentBookField('memo', e.target.value);

        function setStarRating(rating) {
            el.stars.forEach(star => {
                const val = parseInt(star.getAttribute('data-value'));
                if (val <= rating) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });
        }
        el.stars.forEach(star => {
            star.onclick = () => {
                const val = parseInt(star.getAttribute('data-value'));
                setStarRating(val);
                updateCurrentBookField('rating', val);
            };
        });

        el.coverZone.onclick = () => el.coverInput.click();
        el.coverInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                el.coverPreview.src = base64Data;
                el.coverPreview.style.display = 'block';
                el.dropText.style.display = 'none';
                updateCurrentBookField('cover', base64Data);
            };
            reader.readAsDataURL(file);
        };

        el.searchInput.oninput = () => renderBookList();
        el.tabBtns.forEach(tab => {
            tab.onclick = () => {
                el.tabBtns.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.getAttribute('data-status');
                renderBookList();
            };
        });

        el.backListBtn.onclick = () => {
            document.body.classList.remove('editing');
            currentBookId = null;
            el.deleteBtn.setAttribute('disabled', 'true');
            renderBookList();
        };

        el.toggleStatsBtn.onclick = () => {
            isStatsView = !isStatsView;
            if (isStatsView) {
                el.viewEditor.classList.remove('active');
                el.viewStats.classList.add('active');
                el.toggleStatsBtn.textContent = '📝 メモ';
                renderStats();
            } else {
                el.viewStats.classList.remove('active');
                el.viewEditor.classList.add('active');
                el.toggleStatsBtn.textContent = '📊 統計';
            }
        };

        function renderStats() {
            const total = books.length;
            const counts = { reading: 0, read: 0, stocked: 0 };
            books.forEach(b => counts[b.status] = (counts[b.status] || 0) + 1);

            const ratio = total > 0 ? Math.round((counts.read / total) * 100) : 0;
            
            el.statTotal.textContent = total;
            el.statRatio.textContent = ratio + '%';

            const labels = { reading: '読中', read: '読了', stocked: '積読' };
            el.statsBars.innerHTML = '';

            ['read', 'reading', 'stocked'].forEach(status => {
                const count = counts[status] || 0;
                const pct = total > 0 ? (count / total) * 100 : 0;

                const row = document.createElement('div');
                row.className = 'chart-row';
                row.innerHTML = `
                    <div class="chart-label">${labels[status]}</div>
                    <div class="chart-bar-bg">
                        <div class="chart-bar-fill" style="width: ${pct}%"></div>
                    </div>
                    <div class="chart-value">${count} 冊</div>
                `;
                el.statsBars.appendChild(row);
            });
        }

        updateHeaderCounts();
        renderBookList();
    </script>
</body>
</html>
