<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Vault</title>
    <!-- 💡 PWA（ホーム画面起動時）に全画面表示にするための魔法のタグ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-main: #0a0915; --bg-sidebar: #121026; --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06); --bg-selected: rgba(108, 92, 231, 0.2);
            --purple-neon: #a188ff; --purple-main: #6c5ce7; --text-main: #f3f2fa;
            --text-sub: #8b89a6; --star-color: #ffd32a;
            --white-frame: 2px solid rgba(255, 255, 255, 0.3);
        }
        * { box-sizing: border-box; } /* 💡 全要素の枠線・内側余白のはみ出しを防止 */
        body { font-family: sans-serif; margin: 0; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* 💡 サイドバーの基本設定 */
        .sidebar { width: 300px; background: var(--bg-sidebar); border-right: var(--white-frame); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; }
        .toolbar { height: 60px; border-bottom: var(--white-frame); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .action-btn { background: linear-gradient(135deg, var(--purple-main), #855de7); border: none; color: white; font-size: 13px; cursor: pointer; padding: 8px 14px; border-radius: 20px; font-weight: 600; outline: none; }
        .delete-btn { background: rgba(239, 68, 68, 0.1); color: #ff5252; border: var(--white-frame); }
        .search-container { padding: 10px 15px 5px 15px; }
        .search-input { width: 100%; padding: 8px 14px; border: var(--white-frame); border-radius: 20px; background: rgba(255, 255, 255, 0.02); color: var(--text-main); outline: none; }
        
        /* 💡 タブコンテナ：スマホでも絶対に重ならないよう flex-wrap と最小サイズを設定 */
        .status-tab-container { display: flex; padding: 8px 15px 12px 15px; gap: 6px; border-bottom: var(--white-frame); flex-wrap: wrap; }
        .status-tab-btn { flex: 1; min-width: 60px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-sub); font-size: 11px; padding: 8px 4px; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; gap: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-tab-btn.active { background: var(--bg-selected); border-color: var(--purple-neon); color: var(--purple-neon); }
        .status-count { font-size: 10px; opacity: 0.85; }

        .note-list { flex: 1; overflow-y: auto; padding: 10px; gap: 8px; display: flex; flex-direction: column; }
        .note-item { padding: 12px; background: var(--bg-card); border: var(--white-frame); border-radius: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
        .note-item.active { background: var(--bg-selected); border-color: var(--purple-neon); }
        .note-item-cover { width: 36px; height: 50px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .note-item-cover img { width: 100%; height: 100%; object-fit: cover; }
        .note-item-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .note-item-meta { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* メインコンテンツエリア */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at 80% 20%, #13102b 0%, var(--bg-main) 60%); width: 100%; overflow: hidden; }
        
        /* 💡 ヘッダー操作エリア：要素が重ならないよう横並びを固定 */
        .top-control-area { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 100; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
        .top-control-area button { pointer-events: auto; }
        
        /* スマホ専用：本棚リストへ戻るためのボタン（PC時は隠す） */
        .back-menu-btn { display: none; background: #16142c; border: var(--white-frame); color: #fff; font-size: 12px; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .toggle-view-btn { margin-left: auto; background: #16142c; border: var(--white-frame); color: var(--text-main); font-size: 12px; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .toggle-view-btn.active { background: rgba(239, 68, 68, 0.1); border-color: #ff5252; color: #ff5252; }

        .view-content { flex: 1; display: none; overflow-y: auto; padding-top: 50px; width: 100%; }
        .view-content.active { display: block; }
        
        .editor-container { padding: 25px 30px; display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .editor-header { display: flex; gap: 25px; align-items: flex-start; width: 100%; }
        .cover-dropzone { width: 110px; height: 155px; background: rgba(255, 255, 255, 0.02); border: 2px dashed rgba(255, 255, 255, 0.4); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-sub); text-align: center; cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0; }
        .cover-dropzone img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        
        .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex: 1; max-width: 500px; background: rgba(255,255,255,0.01); padding: 12px; border-radius: 12px; border: var(--white-frame); }
        .meta-field { display: flex; align-items: center; gap: 10px; font-size: 12px; width: 100%; }
        .meta-field-label { width: 50px; color: var(--text-sub); font-weight: 600; flex-shrink: 0; }
        .meta-field input, .meta-field select { flex: 1; border: var(--white-frame); background: #16142c; padding: 6px 10px; border-radius: 6px; color: var(--text-main); outline: none; min-width: 0; width: 100%; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.9); }
        .star-rating { display: flex; gap: 4px; font-size: 20px; color: rgba(255,255,255,0.1); cursor: pointer; }
        .star-rating span.selected { color: var(--star-color); }
        
        .input-memo { width: 100%; height: 250px; background: transparent; border: none; border-top: var(--white-frame); padding: 15px 0; color: #dcdbe5; font-size: 15px; line-height: 1.6; resize: none; outline: none; }
        .no-selection { padding: 80px 15px; text-align: center; color: var(--text-sub); font-size: 14px; font-weight: bold; letter-spacing: 0.5px; }
        
        .stats-container { padding: 30px; width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 20px; margin: 0 auto; }
        .stats-card { background: rgba(255,255,255,0.02); border: var(--white-frame); border-radius: 14px; padding: 20px; width: 100%; }
        .stat-badges { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-badge { background: rgba(255, 255, 255, 0.05); border: var(--white-frame); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--purple-neon); }
        .chart-title { font-size: 13px; font-weight: 700; color: var(--purple-neon); margin: 15px 0 8px 0; }
        .chart-row { display: flex; align-items: center; gap: 12px; font-size: 12px; margin-bottom: 8px; width: 100%; }
        .chart-label { width: 50px; color: var(--text-sub); text-align: right; flex-shrink: 0; }
        .chart-bar-bg { flex: 1; height: 10px; background: rgba(255,255,255,0.01); border-radius: 5px; overflow: hidden; border: var(--white-frame); }
        .chart-bar-fill { height: 100%; background: linear-gradient(90deg, var(--purple-main), var(--purple-neon)); width: 0%; transition: width 0.3s; }
        .chart-value { width: 45px; font-weight: 700; flex-shrink: 0; text-align: right; }

        /* 💡 【レスポンシブ対応】スマホ時の完璧なレイアウト調整 */
        @media (max-width: 768px) {
            body { position: relative; }
            /* スマホ時は本棚リストを画面いっぱいに広げる */
            .sidebar { width: 100%; position: absolute; left: 0; top: 0; height: 100%; z-index: 50; }
            /* 本が選択されたら、本棚リストを左に隠すクラス */
            body.editing .sidebar { transform: translateX(-100%); }
            
            /* メインエディターも画面いっぱいに表示 */
            .main-content { width: 100%; height: 100%; }
            /* スマホ専用の「戻る」ボタンを表示 */
            .back-menu-btn { display: block; }
            .editor-container { padding: 15px; padding-top: 30px; }
            
            /* 💡 入力ヘッダーを縦並びにしてはみ出しを防ぐ */
            .editor-header { flex-direction: column; align-items: center; gap: 15px; width: 100%; }
            .meta-grid { width: 100%; max-width: none; grid-template-columns: 1fr; } /* 💡 1列にして極小画面でも収まるように */
            .meta-field style { grid-column: auto; }
            
            .stats-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- サイドバー：本棚リスト -->
    <div class="sidebar">
        <div class="toolbar">
            <button class="action-btn" id="add-book-btn">＋ 新規追加</button>
            <button class="action-btn delete-btn" id="delete-book-btn" style="display: none;">削除</button>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="タイトル・著者で検索...">
        </div>
        
        <div class="status-tab-container">
            <div class="status-tab-btn active" data-status="all">すべて <span class="status-count" id="count-all">(0)</span></div>
            <div class="status-tab-btn" data-status="reading">読中 <span class="status-count" id="count-reading">(0)</span></div>
            <div class="status-tab-btn" data-status="read">読了 <span class="status-count" id="count-read">(0)</span></div>
            <div class="status-tab-btn" data-status="stocked">積読 <span class="status-count" id="count-stocked">(0)</span></div>
        </div>
        
        <div class="note-list" id="book-list">
            <!-- JSで動的に本が追加されます -->
        </div>
    </div>

    <!-- メインコンテンツエリア -->
    <div class="main-content">
        <div class="top-control-area">
            <button class="back-menu-btn" id="back-to-list-btn">← 本棚一覧</button>
            <button class="toggle-view-btn" id="toggle-stats-btn">📊 統計ビュー</button>
        </div>
        
        <!-- エディタービュー -->
        <div class="view-content active" id="view-editor">
            <div id="no-selection-msg" class="no-selection">
                <p>📖 本を選択するか、新規追加してください</p>
            </div>
            
            <div class="editor-container" id="editor-form" style="display: none;">
                <div class="editor-header">
                    <!-- 表紙画像ドロップエリア -->
                    <div class="cover-dropzone" id="cover-zone">
                        <span id="dropzone-text">タップして<br>表紙を追加</span>
                        <img src="" id="cover-preview" style="display: none;">
                        <input type="file" id="cover-input" accept="image/*" style="display: none;">
                    </div>
                    
                    <!-- メタデータ入力グリッド -->
                    <div class="meta-grid">
                        <div class="meta-field">
                            <span class="meta-field-label">タイトル</span>
                            <input type="text" id="book-title" placeholder="本のタイトル">
                        </div>
                        <div class="meta-field">
                            <span class="meta-field-label">著者名</span>
                            <input type="text" id="book-author" placeholder="著者">
                        </div>
                        <div class="meta-field">
                            <span class="meta-field-label">状態</span>
                            <select id="book-status">
                                <option value="stocked">積読 (Stocked)</option>
                                <option value="reading">読中 (Reading)</option>
                                <option value="read">読了 (Read)</option>
                            </select>
                        </div>
                        <div class="meta-field">
                            <span class="meta-field-label">評価</span>
                            <div class="star-rating" id="star-container">
                                <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
                            </div>
                        </div>
                        <div class="meta-field">
                            <span class="meta-field-label">読了日</span>
                            <input type="date" id="book-date">
                        </div>
                    </div>
                </div>
                
                <!-- メモエリア -->
                <textarea class="input-memo" id="book-memo" placeholder="読書メモや心に残ったフレーズを自由に記入..."></textarea>
            </div>
        </div>
        
        <!-- 統計ビュー -->
        <div class="view-content" id="view-stats">
            <div class="stats-container">
                <div class="stats-card">
                    <div class="stat-badges">
                        <div class="stat-badge">総蔵書数: <span id="stat-total">0</span>冊</div>
                        <div class="stat-badge">読了率: <span id="stat-ratio">0</span>%</div>
                    </div>
                    
                    <div class="chart-title">読書ステータス</div>
                    <div id="stats-bars">
                        <!-- JSでグラフバーを動的生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- アプリの全挙動を司るJavaScript -->
    <script>
        let books = JSON.parse(localStorage.getItem('my_book_vault_data')) || [];
        let currentBookId = null;
        let currentFilter = 'all';
        let isStatsView = false;
        let selectedRating = 0;

        const el = {
            bookList: document.getElementById('book-list'),
            addBtn: document.getElementById('add-book-btn'),
            deleteBtn: document.getElementById('delete-book-btn'),
            searchInput: document.getElementById('search-input'),
            tabBtns: document.querySelectorAll('.status-tab-btn'),
            editorForm: document.getElementById('editor-form'),
            noSelectMsg: document.getElementById('no-selection-msg'),
            toggleStatsBtn: document.getElementById('toggle-stats-btn'),
            viewEditor: document.getElementById('view-editor'),
            viewStats: document.getElementById('view-stats'),
            backListBtn: document.getElementById('back-to-list-btn'),
            
            title: document.getElementById('book-title'),
            author: document.getElementById('book-author'),
            status: document.getElementById('book-status'),
            date: document.getElementById('book-date'),
            memo: document.getElementById('book-memo'),
            stars: document.querySelectorAll('#star-container span'),
            coverZone: document.getElementById('cover-zone'),
            coverInput: document.getElementById('cover-input'),
            coverPreview: document.getElementById('cover-preview'),
            dropText: document.getElementById('dropzone-text'),
            
            cAll: document.getElementById('count-all'),
            cReading: document.getElementById('count-reading'),
            cRead: document.getElementById('count-read'),
            cStocked: document.getElementById('count-stocked'),
            statTotal: document.getElementById('stat-total'),
            statRatio: document.getElementById('stat-ratio'),
            statsBars: document.getElementById('stats-bars')
        };

        function saveData() {
            localStorage.setItem('my_book_vault_data', JSON.stringify(books));
            updateCounts();
            renderBookList();
            if(isStatsView) renderStats();
        }

        function updateCounts() {
            const counts = { all: books.length, reading: 0, read: 0, stocked: 0 };
            books.forEach(b => counts[b.status] = (counts[b.status] || 0) + 1);
            
            el.cAll.textContent = `(${counts.all})`;
            el.cReading.textContent = `(${counts.reading})`;
            el.cRead.textContent = `(${counts.read})`;
            el.cStocked.textContent = `(${counts.stocked})`;
        }

        function renderBookList() {
            el.bookList.innerHTML = '';
            const searchWord = el.searchInput.value.toLowerCase();
            
            const filtered = books.filter(book => {
                const matchTab = currentFilter === 'all' || book.status === currentFilter;
                const matchSearch = book.title.toLowerCase().includes(searchWord) || book.author.toLowerCase().includes(searchWord);
                return matchTab && matchSearch;
            });

            if (filtered.length === 0) {
                el.bookList.innerHTML = '<div style="text-align:center;color:var(--text-sub);font-size:12px;padding:20px;">本が見つかりません</div>';
                return;
            }

            filtered.forEach(book => {
                const item = document.createElement('div');
                item.className = `note-item ${book.id === currentBookId ? 'active' : ''}`;
                item.onclick = () => selectBook(book.id);

                const starText = '★'.repeat(book.rating) + '☆'.repeat(5 - book.rating);
                const coverHTML = book.cover ? `<img src="${book.cover}">` : `<span style="font-size:10px;color:var(--text-sub)">No Img</span>`;

                item.innerHTML = `
                    <div class="note-item-cover">${coverHTML}</div>
                    <div style="flex:1; min-width:0;">
                        <div class="note-item-title">${book.title || '無題の本'}</div>
                        <div class="note-item-meta">${book.author || '著者不明'}</div>
                        <div class="note-item-meta" style="color:var(--star-color); margin-top:2px;">${starText}</div>
                    </div>
                `;
                el.bookList.appendChild(item);
            });
        }

        function selectBook(id) {
            currentBookId = id;
            const book = books.find(b => b.id === id);
            if (!book) return;

            document.body.classList.add('editing');

            el.title.value = book.title;
            el.author.value = book.author;
            el.status.value = book.status;
            el.date.value = book.date || '';
            el.memo.value = book.memo || '';
            setStarRating(book.rating || 0);

            if (book.cover) {
                el.coverPreview.src = book.cover;
                el.coverPreview.style.display = 'block';
                el.dropText.style.display = 'none';
            } else {
                el.coverPreview.style.display = 'none';
                el.dropText.style.display = 'block';
            }

            el.noSelectMsg.style.display = 'none';
            el.editorForm.style.display = 'flex';
            el.deleteBtn.style.display = 'block';

            renderBookList();
        }

        el.addBtn.onclick = () => {
            const newBook = {
                id: Date.now().toString(),
                title: '',
                author: '',
                status: currentFilter === 'all' ? 'stocked' : currentFilter,
                rating: 0,
                date: '',
                memo: '',
                cover: ''
            };
            books.unshift(newBook);
            saveData();
            selectBook(newBook.id);
            el.title.focus();
        };

        el.deleteBtn.onclick = () => {
            if (!currentBookId) return;
            if (confirm('この本を本棚から削除しますか？')) {
                books = books.filter(b => b.id !== currentBookId);
                currentBookId = null;
                el.editorForm.style.display = 'none';
                el.deleteBtn.style.display = 'none';
                el.noSelectMsg.style.display = 'block';
                document.body.classList.remove('editing');
                saveData();
            }
        };

        function updateCurrentBookField(field, value) {
            if (!currentBookId) return;
            const book = books.find(b => b.id === currentBookId);
            if (book) {
                book[field] = value;
                saveData();
            }
        }
        el.title.oninput = (e) => updateCurrentBookField('title', e.target.value);
        el.author.oninput = (e) => updateCurrentBookField('author', e.target.value);
        el.status.onchange = (e) => updateCurrentBookField('status', e.target.value);
        el.date.onchange = (e) => updateCurrentBookField('date', e.target.value);
        el.memo.oninput = (e) => updateCurrentBookField('memo', e.target.value);

        function setStarRating(rating) {
            selectedRating = rating;
            el.stars.forEach(star => {
                const val = parseInt(star.getAttribute('data-value'));
                if (val <= rating) {
                    star.classList.add('selected');
                } else {
                    star.classList.remove('selected');
                }
            });
        }
        el.stars.forEach(star => {
            star.onclick = () => {
                const val = parseInt(star.getAttribute('data-value'));
                setStarRating(val);
                updateCurrentBookField('rating', val);
            };
        });

        el.coverZone.onclick = () => el.coverInput.click();
        el.coverInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                el.coverPreview.src = base64Data;
                el.coverPreview.style.display = 'block';
                el.dropText.style.display = 'none';
                updateCurrentBookField('cover', base64Data);
            };
            reader.readAsDataURL(file);
        };

        el.searchInput.oninput = () => renderBookList();
        el.tabBtns.forEach(tab => {
            tab.onclick = () => {
                el.tabBtns.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.getAttribute('data-status');
                renderBookList();
            };
        });

        el.backListBtn.onclick = () => {
            document.body.classList.remove('editing');
        };

        el.toggleStatsBtn.onclick = () => {
            isStatsView = !isStatsView;
            if (isStatsView) {
                el.viewEditor.classList.remove('active');
                el.viewStats.classList.add('add-book-btn'); // 修正箇所：正しくは classList.add('active')
                el.viewStats.classList.add('active');
                el.toggleStatsBtn.textContent = '📝 エディター';
                el.toggleStatsBtn.classList.add('active');
                renderStats();
            } else {
                el.viewStats.classList.remove('active');
                el.viewEditor.classList.add('active');
                el.toggleStatsBtn.textContent = '📊 統計ビュー';
                el.toggleStatsBtn.classList.remove('active');
            }
        };

        function renderStats() {
            const total = books.length;
            const counts = { reading: 0, read: 0, stocked: 0 };
            books.forEach(b => counts[b.status] = (counts[b.status] || 0) + 1);

            const ratio = total > 0 ? Math.round((counts.read / total) * 100) : 0;
            
            el.statTotal.textContent = total;
            el.statRatio.textContent = ratio;

            const labels = { reading: '読中', read: '読了', stocked: '積読' };
            el.statsBars.innerHTML = '';

            ['read', 'reading', 'stocked'].forEach(status => {
                const count = counts[status] || 0;
                const pct = total > 0 ? (count / total) * 100 : 0;

                const row = document.createElement('div');
                row.className = 'chart-row';
                row.innerHTML = `
                    <div class="chart-label">${labels[status]}</div>
                    <div class="chart-bar-bg">
                        <div class="chart-bar-fill" style="width: ${pct}%"></div>
                    </div>
                    <div class="chart-value">${count} 冊</div>
                `;
                el.statsBars.appendChild(row);
            });
        }

        updateCounts();
        renderBookList();
    </script>
</body>
</html>
