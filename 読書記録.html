<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Vault</title>
    <!-- 💡 PWA（ホーム画面起動時）に全画面表示にするための魔法のタグ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-main: #0a0915; --bg-sidebar: #121026; --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06); --bg-selected: rgba(108, 92, 231, 0.2);
            --purple-neon: #a188ff; --purple-main: #6c5ce7; --text-main: #f3f2fa;
            --text-sub: #8b89a6; --star-color: #ffd32a;
            --white-frame: 2px solid rgba(255, 255, 255, 0.3);
        }
        body { font-family: sans-serif; margin: 0; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* 💡 サイドバーの基本設定 */
        .sidebar { width: 300px; background: var(--bg-sidebar); border-right: var(--white-frame); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; }
        .toolbar { height: 60px; border-bottom: var(--white-frame); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .action-btn { background: linear-gradient(135deg, var(--purple-main), #855de7); border: none; color: white; font-size: 13px; cursor: pointer; padding: 8px 14px; border-radius: 20px; font-weight: 600; outline: none; }
        .delete-btn { background: rgba(239, 68, 68, 0.1); color: #ff5252; border: var(--white-frame); }
        .search-container { padding: 10px 15px 5px 15px; }
        .search-input { width: 100%; padding: 8px 14px; border: var(--white-frame); border-radius: 20px; background: rgba(255, 255, 255, 0.02); color: var(--text-main); outline: none; box-sizing: border-box; }
        
        .status-tab-container { display: flex; padding: 8px 15px 12px 15px; gap: 6px; border-bottom: var(--white-frame); }
        .status-tab-btn { flex: 1; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-sub); font-size: 12px; padding: 10px 0; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .status-tab-btn.active { background: var(--bg-selected); border-color: var(--purple-neon); color: var(--purple-neon); }
        .status-count { font-size: 10px; opacity: 0.85; }

        .note-list { flex: 1; overflow-y: auto; padding: 10px; gap: 8px; display: flex; flex-direction: column; }
        .note-item { padding: 12px; background: var(--bg-card); border: var(--white-frame); border-radius: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
        .note-item.active { background: var(--bg-selected); border-color: var(--purple-neon); }
        .note-item-cover { width: 36px; height: 50px; background: rgba(255,255,255,0.05); object-fit: cover; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .note-item-cover img { width: 100%; height: 100%; object-fit: cover; }
        .note-item-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .note-item-meta { font-size: 11px; color: var(--text-sub); }
        
        /* メインコンテンツエリア */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at 80% 20%, #13102b 0%, var(--bg-main) 60%); }
        
        .top-control-area { position: absolute; top: 15px; right: 20px; z-index: 100; display: flex; gap: 10px; }
        /* 💡 スマホ専用：本棚リストへ戻るためのボタン（PC時は隠す） */
        .back-menu-btn { display: none; background: #16142c; border: var(--white-frame); color: #fff; font-size: 12px; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .toggle-view-btn { background: #16142c; border: var(--white-frame); color: var(--text-main); font-size: 12px; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .toggle-view-btn.active { background: rgba(239, 68, 68, 0.1); border-color: #ff5252; color: #ff5252; font-size: 16px; width: 32px; height: 32px; padding: 0; border-radius: 50%; }

        .view-content { flex: 1; display: none; overflow-y: auto; padding-top: 30px; }
        .view-content.active { display: block; }
        
        .editor-container { padding: 25px 30px; display: flex; flex-direction: column; gap: 20px; }
        .editor-header { display: flex; gap: 25px; align-items: flex-start; }
        .cover-dropzone { width: 110px; height: 155px; background: rgba(255, 255, 255, 0.02); border: 2px dashed rgba(255, 255, 255, 0.4); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-sub); text-align: center; cursor: pointer; position: relative; overflow: hidden; }
        .cover-dropzone img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        
        .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex: 1; max-width: 500px; background: rgba(255,255,255,0.01); padding: 12px; border-radius: 12px; border: var(--white-frame); }
        .meta-field { display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .meta-field-label { width: 50px; color: var(--text-sub); font-weight: 600; }
        .meta-field input, .meta-field select { flex: 1; border: var(--white-frame); background: #16142c; padding: 6px 10px; border-radius: 6px; color: var(--text-main); outline: none; box-sizing: border-box; min-width: 0; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.9); }
        .star-rating { display: flex; gap: 4px; font-size: 20px; color: rgba(255,255,255,0.1); cursor: pointer; }
        .star-rating span.selected { color: var(--star-color); }
        
        .input-memo { width: 100%; height: 250px; background: transparent; border: none; border-top: var(--white-frame); padding-top: 15px; color: #dcdbe5; font-size: 15px; line-height: 1.6; resize: none; outline: none; box-sizing: border-box; }
        .no-selection { padding: 80px 0; text-align: center; color: var(--text-sub); font-size: 14px; font-weight: bold; letter-spacing: 0.5px; }
        
        .stats-container { padding: 30px; max-width: 700px; display: flex; flex-direction: column; gap: 20px; }
        .stats-card { background: rgba(255,255,255,0.02); border: var(--white-frame); border-radius: 14px; padding: 20px; }
        .stat-badges { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-badge { background: rgba(255, 255, 255, 0.05); border: var(--white-frame); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--purple-neon); }
        .chart-title { font-size: 13px; font-weight: 700; color: var(--purple-neon); margin: 15px 0 8px 0; }
        .chart-row { display: flex; align-items: center; gap: 12px; font-size: 12px; margin-bottom: 8px; }
        .chart-label { width: 70px; color: var(--text-sub); text-align: right; }
        .chart-bar-bg { flex: 1; height: 10px; background: rgba(255,255,255,0.01); border-radius: 5px; overflow: hidden; border: var(--white-frame); }
        .chart-bar-fill { height: 100%; background: linear-gradient(90deg, var(--purple-main), var(--purple-neon)); width: 0%; transition: width 0.3s; }
        .chart-value { width: 45px; font-weight: 700; }

        /* 💡 【レスポンシブ対応】画面の横幅が768px以下（スマホ）の時の表示ルール */
        @media (max-width: 768px) {
            body { position: relative; }
            /* スマホ時は本棚リストを画面いっぱいに広げる */
            .sidebar { width: 100%; position: absolute; left: 0; top: 0; height: 100%; z-index: 50; }
            /* 本が選択されたら、本棚リストを左に隠すクラス */
            body.editing .sidebar { transform: translateX(-100%); }
            
            /* メインエディターも画面いっぱいに広げる */
            .main-content { width: 100%; }
            .editor-header { flex-direction: column; align-items: center; }
            .meta-grid { width: 100%; max-width: 100%; }
            
            /* スマホ時のみ、エディター画面に「戻る」ボタンを表示 */
            body.editing .back-menu-btn { display: block; }
            .view-content { padding-top: 50px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="toolbar">
            <button class="action-btn delete-btn" id="delete-btn" onclick="deleteBook()" style="visibility:hidden;">削除</button>
            <button class="action-btn" onclick="addBook()">＋ 本を追加</button>
        </div>
        <div class="search-container"><input type="text" id="search-bar" class="search-input" placeholder="本を探す..." oninput="showList()"></div>
        
        <div class="status-tab-container">
            <div id="stab-all" class="status-tab-btn active" onclick="setStatusFilter('all')"><span>すべて</span><span id="count-all" class="status-count">(0)</span></div>
            <div id="stab-積読" class="status-tab-btn" onclick="setStatusFilter('積読')"><span>積読</span><span id="count-積読" class="status-count">(0)</span></div>
            <div id="stab-読書中" class="status-tab-btn" onclick="setStatusFilter('読書中')"><span>読書中</span><span id="count-読書中" class="status-count">(0)</span></div>
            <div id="stab-読了" class="status-tab-btn" onclick="setStatusFilter('読了')"><span>読了</span><span id="count-読了" class="status-count">(0)</span></div>
        </div>
        <div class="note-list" id="note-list"></div>
    </div>
    
    <div class="main-content">
        <div class="top-control-area">
            <!-- 💡 スマホ専用の「一覧に戻る」ボタン -->
            <button class="back-menu-btn" onclick="goBackToList()">⇦ 一覧</button>
            <button id="toggle-stats-btn" class="toggle-view-btn" onclick="toggleStatsView()">📊 読了データ表示</button>
        </div>

        <div id="v-book" class="view-content active">
            <div class="no-selection" id="no-select">⇦ 本を追加するか選択してください</div>
            <div class="editor-container" id="editor" style="display:none;">
                <div class="editor-header">
                    <input type="file" id="file-in" accept="image/*" style="display:none;" onchange="imgIn(event)">
                    <div class="cover-dropzone" id="dropzone" onclick="document.getElementById('file-in').click()">
                        <span id="drop-txt">タップして<br>表紙画像を<br>追加</span>
                    </div>
                    <div class="meta-grid">
                        <div class="meta-field"><span class="meta-field-label">タイトル</span><input type="text" id="i-title" oninput="save()"></div>
                        <div class="meta-field"><span class="meta-field-label">著者</span><input type="text" id="i-author" oninput="save()"></div>
                        <div class="meta-field"><span class="meta-field-label">出版社</span><input type="text" id="i-pub" oninput="save()"></div>
                        <div class="meta-field"><span class="meta-field-label">ページ数</span><input type="number" id="i-pages" min="0" oninput="save()"></div>
                        <div class="meta-field"><span class="meta-field-label">状態</span>
                            <select id="i-status" onchange="toggleDateAndSave()">
                                <option value="積読">積読</option>
                                <option value="読書中">読書中</option>
                                <option value="読了">読了</option>
                            </select>
                        </div>
                        <div class="meta-field" id="date-field-container" style="display: none;"><span class="meta-field-label">読了日</span><input type="date" id="i-date" oninput="save()"></div>
                        <div class="meta-field" style="grid-column: span 2;"><span class="meta-field-label">評価</span>
                            <div class="star-rating" id="stars">
                                <span onclick="star(1)">★</span><span onclick="star(2)">★</span><span onclick="star(3)">★</span><span onclick="star(4)">★</span><span onclick="star(5)">★</span>
                            </div>
                        </div>
                    </div>
                </div>
                <textarea class="input-memo" id="i-memo" placeholder="読書メモや感想を入力..." oninput="save()"></textarea>
            </div>
        </div>
        
        <div id="v-stats" class="view-content">
            <div class="stats-container">
                <div class="stats-card">
                    <div class="stat-badges">
                        <div class="stat-badge" id="st-total">総読書数: 0 冊</div>
                        <div class="stat-badge" id="st-pages">総ページ数: 0 p</div>
                        <div class="stat-badge" id="st-avg">平均評価: ★0.0</div>
                    </div>
                    <div class="chart-title">年別の読書数</div><div id="c-year"></div>
                    <div class="chart-title">月別の読書数</div><div id="c-month"></div>
                    <div class="chart-title">評価別の割合</div><div id="c-star"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let db = JSON.parse(localStorage.getItem('my_bv_data')) || [];
        let curId = null;
        let isStatsMode = false;
        let currentFilter = 'all';

        window.onload = () => { showList(); calcStats(); };

        function toggleStatsView() {
            let btn = document.getElementById('toggle-stats-btn');
            isStatsMode = !isStatsMode;

            if (isStatsMode) {
                document.getElementById('v-book').classList.remove('active');
                document.getElementById('v-stats').classList.add('active');
                btn.textContent = "×";
                btn.classList.add('active');
                calcStats();
            } else {
                document.getElementById('v-stats').classList.remove('active');
                document.getElementById('v-book').classList.add('active');
                btn.textContent = "📊 読了データ表示";
                btn.classList.remove('active');
            }
        }

        function setStatusFilter(filterValue) {
            currentFilter = filterValue;
            document.querySelectorAll('.status-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('stab-' + filterValue).classList.add('active');
            showList();
        }

        function addBook() {
            if (isStatsMode) toggleStatsView();
            let initialStatus = (currentFilter === 'all') ? '積読' : currentFilter;
            let b = { id:'b_'+Date.now(), title:'', author:'', publisher:'', pages:'', status:initialStatus, date:'', stars:0, memo:'', cover:'' };
            db.unshift(b); localStorage.setItem('my_bv_data', JSON.stringify(db));
            showList(); selectBook(b.id);
            setTimeout(() => document.getElementById('i-title').focus(), 50);
        }

        function showList() {
            let q = document.getElementById('search-bar').value.toLowerCase();
            let html = '';
            let countAll = db.length, countUnread = 0, countReading = 0, countFinished = 0;

            db.forEach(b => {
                if (b.status === '積読') countUnread++;
                else if (b.status === '読書中') countReading++;
                else if (b.status === '読了') countFinished++;
            });

            document.getElementById('count-all').textContent = `(${countAll})`;
            document.getElementById('count-積読').textContent = `(${countUnread})`;
            document.getElementById('count-読書中').textContent = `(${countReading})`;
            document.getElementById('count-読了').textContent = `(${countFinished})`;

            db.filter(b => {
                let matchQuery = (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q);
                let matchStatus = (currentFilter === 'all') || (b.status === currentFilter);
                return matchQuery && matchStatus;
            }).forEach(b => {
                let img = b.cover ? `<img src="${b.cover}">` : `<span style="font-size:8px;color:var(--text-sub)">NoImg</span>`;
                html += `<div class="note-item ${b.id===curId?'active':''}" onclick="selectBook('${b.id}')">
                    <div class="note-item-cover">${img}</div>
                    <div style="flex:1;min-width:0;">
                        <div class="note-item-title">${b.title||'無題の本'}</div>
                        <div class="note-item-meta">${b.author||'未設定'}${b.pages?' ｜ '+b.pages+'p':''}</div>
                    </div>
                </div>`;
            });
            document.getElementById('note-list').innerHTML = html;
        }

        function selectBook(id) {
            if (isStatsMode) toggleStatsView();
            curId = id; showList();
            let b = db.find(x => x.id === id); if(!b) return;
            
            // 💡 スマホ表示を「エディター画面モード」に切り替える
            document.body.classList.add('editing');

            document.getElementById('no-select').style.display = 'none';
            document.getElementById('editor').style.display = 'flex';
            document.getElementById('delete-btn').style.visibility = 'visible';
            document.getElementById('i-title').value = b.title || '';
            document.getElementById('i-author').value = b.author || '';
            document.getElementById('i-pub').value = b.publisher || '';
            document.getElementById('i-pages').value = b.pages || '';
            document.getElementById('i-status').value = b.status || '積読';
            document.getElementById('i-date').value = b.date || '';
            document.getElementById('i-memo').value = b.memo || '';
            
            document.getElementById('date-field-container').style.display = (b.status === '読了') ? 'flex' : 'none';
            
            stUI(b.stars);
            let dz = document.getElementById('dropzone');
            dz.innerHTML = b.cover ? `<img src="${b.cover}">` : `<span id="drop-txt">タップして<br>表紙画像を<br>追加</span>`;
        }

        // 💡 スマホ専用：エディターから本棚リスト画面に戻る関数
        function goBackToList() {
            document.body.classList.remove('editing');
        }

        function toggleDateAndSave() {
            let status = document.getElementById('i-status').value;
            document.getElementById('date-field-container').style.display = (status === '読了') ? 'flex' : 'none';
            save(); showList(); 
        }

        function save() {
            if(!curId) return; let b = db.find(x => x.id === curId); if(!b) return;
            b.title = document.getElementById('i-title').value;
            b.author = document.getElementById('i-author').value;
            b.publisher = document.getElementById('i-pub').value;
            b.pages = document.getElementById('i-pages').value;
            b.status = document.getElementById('i-status').value;
            b.date = document.getElementById('i-date').value;
            b.memo = document.getElementById('i-memo').value;
            localStorage.setItem('my_bv_data', JSON.stringify(db));
            
            let item = document.querySelector(`.note-item.active .note-item-title`);
            if(item) item.textContent = b.title || '無題の本';
            let meta = document.querySelector(`.note-item.active .note-item-meta`);
            if(meta) meta.textContent = (b.author||'未設定') + (b.pages?' ｜ '+b.pages+'p':'');
        }

        function star(n) {
            if(!curId) return; let b = db.find(x => x.id === curId); if(!b) return;
            b.stars = b.stars === n ? 0 : n; stUI(b.stars); save();
        }

        function stUI(n) {
            document.querySelectorAll('#stars span').forEach((s, i) => s.classList.toggle('selected', i < n));
        }

        function deleteBook() {
            if(!curId || !confirm('削除しますか？')) return;
            db = db.filter(x => x.id !== curId); curId = null;
            localStorage.setItem('my_bv_data', JSON.stringify(db)); showList();
            document.getElementById('editor').style.display = 'none';
            document.getElementById('delete-btn').style.visibility = 'hidden';
            document.getElementById('no-select').style.display = 'flex';
            goBackToList(); // 削除したらスマホ表示をリストに戻す
        }

        function imgIn(e) {
            let f = e.target.files; if(!f) return;
            let r = new FileReader(); r.onload = (ev) => {
                let b = db.find(x => x.id === curId); if(!b) return;
                b.cover = ev.target.result; localStorage.setItem('my_bv_data', JSON.stringify(db));
                selectBook(curId);
            }; r.readAsDataURL(f);
        }

        function makeRow(lbl, val, max) {
            let p = max > 0 ? (val / max) * 100 : 0;
            return `<div class="chart-row">
                <div class="chart-label">${lbl}</div>
                <div class="chart-bar-bg"><div class="chart-bar-fill" style="width:${p}%"></div></div>
                <div class="chart-value">${val}冊</div>
            </div>`;
        }

        function calcStats() {
            let finishedBooks = db.filter(b => b.status === '読了');
            document.getElementById('st-total').textContent = `総読書数: ${finishedBooks.length} 冊`;
            let pSum = finishedBooks.reduce((a, b) => a + (parseInt(b.pages)||0), 0);
            document.getElementById('st-pages').textContent = `総ページ数: ${pSum.toLocaleString()} p`;
            let sSum = finishedBooks.reduce((a, b) => a + (b.stars||0), 0);
            document.getElementById('st-avg').textContent = `平均評価: ★${finishedBooks.length ? (sSum/finishedBooks.length).toFixed(1) : '0.0'}`;

            let ys={}, ms={}, ss={5:0,4:0,3:0,2:0,1:0};
            finishedBooks.forEach(b => {
                if(b.stars) ss[b.stars]++;
                if(b.date) {
                    let y = b.date.substring(0, 4) + '年'; ys[y] = (ys[y]||0) + 1;
                    let m = parseInt(b.date.substring(5, 7)) + '月'; ms[m] = (ms[m]||0) + 1;
                }
            });

            let mY = Math.max(...Object.values(ys), 0), yH = '';
            Object.keys(ys).sort().reverse().forEach(k => yH += makeRow(k, ys[k], mY));
            document.getElementById('c-year').innerHTML = yH || '<div style="font-size:12px;color:var(--text-sub)">データなし</div>';

            let mM = Math.max(...Object.values(ms), 0), mH = '';
            ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'].forEach(k => {
                if(ms[k]) mH += makeRow(k, ms[k], mM);
            });
            document.getElementById('c-month').innerHTML = mH || '<div style="font-size:12px;color:var(--text-sub)">データなし</div>';

            let mS = Math.max(...Object.values(ss), 0), sH = '';
            for(let i=5; i>=1; i--) sH += makeRow('★'+i, ss[i], mS);
            document.getElementById('c-star').innerHTML = sH;
        }
    </script>
</body>
</html>
